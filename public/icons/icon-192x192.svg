<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Fe-Drop Blood Droplet Gradient -->
    <linearGradient id="feDropGrad192" x1="40" y1="20" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glossGrad192" x1="60" y1="30" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Pill Gradients -->
    <linearGradient id="pillPink192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pillWhite192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Maskable Rounded Canvas Background -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad192)"/>
  <rect x="2" y="2" width="188" height="188" rx="42" fill="none" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Soft Ambient Glow -->
  <circle cx="96" cy="96" r="68" fill="#fb7185" fill-opacity="0.2" filter="blur(16px)"/>

  <!-- Outer Shadow -->
  <ellipse cx="96" cy="156" rx="44" ry="9" fill="#be123c" fill-opacity="0.2"/>

  <!-- Fe-Drop Mascot Body -->
  <path
    d="M96 30 C96 30 146 84 146 116 C146 143 123.6 156 96 156 C68.4 156 46 143 46 116 C46 84 96 30 96 30 Z"
    fill="url(#feDropGrad192)"
  />

  <!-- Glossy Reflection Highlight -->
  <path
    d="M96 38 C96 38 68 78 63 106 C60 124 70 140 85 146 C71 140 61 126 63 108 C66 85 96 38 96 38 Z"
    fill="url(#glossGrad192)"
  />

  <!-- Cheerful Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="82" cy="105" rx="5.5" ry="7.5" fill="#1e293b"/>
    <circle cx="80.5" cy="102" r="2.4" fill="#ffffff"/>
    <circle cx="84" cy="108" r="1.1" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="110" cy="105" rx="5.5" ry="7.5" fill="#1e293b"/>
    <circle cx="108.5" cy="102" r="2.4" fill="#ffffff"/>
    <circle cx="112" cy="108" r="1.1" fill="#ffffff"/>
  </g>

  <!-- Rosy Cheeks -->
  <ellipse cx="70" cy="113" rx="6" ry="3.5" fill="#ff8da1" fill-opacity="0.85"/>
  <ellipse cx="122" cy="113" rx="6" ry="3.5" fill="#ff8da1" fill-opacity="0.85"/>

  <!-- Sweet Smile -->
  <path
    d="M88 114 Q96 123 104 114"
    stroke="#1e293b"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Iron "Fe" Capsule / Tablet -->
  <g transform="translate(114, 118) rotate(-22) scale(0.95)">
    <!-- Pill Drop Shadow -->
    <rect x="1" y="2" width="28" height="14" rx="7" fill="#881337" fill-opacity="0.25"/>
    <!-- Left Pink Side -->
    <rect x="0" y="0" width="15" height="14" rx="7" fill="url(#pillPink192)"/>
    <!-- Right White Side -->
    <rect x="13" y="0" width="15" height="14" rx="7" fill="url(#pillWhite192)" stroke="#fda4af" stroke-width="0.8"/>
    <line x1="14" y1="0" x2="14" y2="14" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Iron Fe Text -->
    <text x="4" y="10" fill="#ffffff" font-size="7" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Fe</text>
  </g>

  <!-- Sparkles -->
  <path d="M140 48 L142 55 L149 57 L142 59 L140 66 L138 59 L131 57 L138 55 Z" fill="#f59e0b"/>
  <path d="M46 68 L47.5 73 L52 74 L47.5 75 L46 80 L44.5 75 L40 74 L44.5 73 Z" fill="#ec4899"/>
  <circle cx="152" cy="86" r="2.2" fill="#fda4af"/>
</svg>
