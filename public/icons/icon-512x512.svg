<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Fe-Drop Blood Droplet Gradient -->
    <linearGradient id="feDropGrad512" x1="100" y1="50" x2="380" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="glossGrad512" x1="160" y1="80" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Capsule Pill Gradients -->
    <linearGradient id="pillPink512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pillWhite512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Maskable Rounded Canvas Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad512)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#f43f5e" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="#fb7185" fill-opacity="0.2" filter="blur(40px)"/>

  <!-- Outer Shadow -->
  <ellipse cx="256" cy="416" rx="118" ry="24" fill="#be123c" fill-opacity="0.2"/>

  <!-- Fe-Drop Mascot Body -->
  <path
    d="M256 80 C256 80 390 224 390 310 C390 382 330 416 256 416 C182 416 122 382 122 310 C122 224 256 80 256 80 Z"
    fill="url(#feDropGrad512)"
  />

  <!-- Glossy Reflection Highlight -->
  <path
    d="M256 102 C256 102 181 208 168 283 C160 331 187 374 227 390 C190 374 163 336 168 288 C176 227 256 102 256 102 Z"
    fill="url(#glossGrad512)"
  />

  <!-- Cheerful Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="218" cy="280" rx="14.5" ry="20" fill="#1e293b"/>
    <circle cx="214" cy="272" r="6.5" fill="#ffffff"/>
    <circle cx="224" cy="288" r="3" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="294" cy="280" rx="14.5" ry="20" fill="#1e293b"/>
    <circle cx="290" cy="272" r="6.5" fill="#ffffff"/>
    <circle cx="300" cy="288" r="3" fill="#ffffff"/>
  </g>

  <!-- Rosy Cheeks -->
  <ellipse cx="187" cy="302" rx="16" ry="9.5" fill="#ff8da1" fill-opacity="0.85"/>
  <ellipse cx="325" cy="302" rx="16" ry="9.5" fill="#ff8da1" fill-opacity="0.85"/>

  <!-- Sweet Smile -->
  <path
    d="M235 304 Q256 328 277 304"
    stroke="#1e293b"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Iron "Fe" Capsule / Tablet -->
  <g transform="translate(304, 315) rotate(-22) scale(1)">
    <!-- Pill Drop Shadow -->
    <rect x="2" y="5" width="75" height="38" rx="19" fill="#881337" fill-opacity="0.25"/>
    <!-- Left Pink Side -->
    <rect x="0" y="0" width="40" height="38" rx="19" fill="url(#pillPink512)"/>
    <!-- Right White Side -->
    <rect x="35" y="0" width="40" height="38" rx="19" fill="url(#pillWhite512)" stroke="#fda4af" stroke-width="2"/>
    <line x1="38" y1="0" x2="38" y2="38" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Iron Fe Text -->
    <text x="11" y="27" fill="#ffffff" font-size="19" font-weight="900" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Fe</text>
  </g>

  <!-- Sparkles -->
  <path d="M374 128 L379 146 L398 152 L379 157 L374 176 L368 157 L350 152 L368 146 Z" fill="#f59e0b"/>
  <path d="M122 180 L126 193 L138 196 L126 199 L122 212 L118 199 L106 196 L118 193 Z" fill="#ec4899"/>
  <circle cx="406" cy="230" r="6" fill="#fda4af"/>
</svg>
